[package]
name = "wherebus"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wherebus-web"
path = "src/bin/web.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider", "query", "form"] }
rustls = "0.23"
webpki-roots = "1.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tracing = "0.1"
md-5 = "0.11"
aes = "0.9"
base64 = "0.22"
ecb = { version = "0.2", features = ["alloc"] }
